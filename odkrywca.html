<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title
  data-pl="TRYB ODKRYWCY"
  data-en="EXPLORER MODE"
  data-ua="РЕЖИМ ДОСЛІДНИКА">
  TRYB ODKRYWCY
</title>

<style>
* {box-sizing: border-box;}

:root {
    --bg: #eef2f7;
    --text: #333;
    --card: #ffffff;
    --primary: #2b3a55;
    --border: #d0d0d0;
    --hover: #f0f4ff;
    --footer-line: #000000;
}

body.dark {
    --bg: #1a1f2b;
    --text: #ffffff;
    --card: #232a3b;
    --primary: #8fa4c8;
    --border: #3a3f4f;
    --hover: #2f3a55;
    --footer-line: #ffffff;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    transition: background 0.3s, color 0.3s;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 35px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.12);
    transition: background 0.3s, border 0.3s;
}

a {
    color: var(--primary);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

h1 {
    font-size: 32px;
    margin: 15px 0 10px;
}

.description {
    color: var(--text);
    opacity: 0.75;
    line-height: 1.6;
}

.country {
    font-size: 30px;
    font-weight: bold;
    margin: 35px 0 25px;
    color: var(--primary);
}

input[type="text"] {
    width: 100%;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    outline: none;
    margin-bottom: 15px;
    transition: background 0.3s, color 0.3s, border 0.3s;
}

input[type="text"]::placeholder {
    color: var(--text);
    opacity: 0.5;
}

input[type="text"]:focus {
    border-color: var(--primary);
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin: 5px;
}

button:hover {
    transform: translateY(-2px);
}

.primary {
    background: #398be5;
    color: white;
}

.secondary {
    background: var(--hover);
    color: var(--text);
    border: 1px solid var(--border);
}

.stats {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 25px 0;
    flex-wrap: wrap;
}

.stat {
    color: var(--text);
    opacity: 0.75;
}

.stat strong {
    display: block;
    color: var(--text);
    font-size: 25px;
    margin-top: 5px;
    opacity: 1;
}

#feedback {
    min-height: 28px;
    font-weight: bold;
    margin: 18px 0;
}

.correct {
    color: #239653;
}

.wrong {
    color: #d94b4b;
}

body.dark .correct {
    color: #6fe0a0;
}

body.dark .wrong {
    color: #ff9292;
}

.theme-toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 10;
}

.toggle {
    position: relative;
    width: 50px;
    height: 26px;
}

.toggle input {
    display: none;
}

.slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.slider::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: 0.3s;
}

.toggle input:checked + .slider {
    background: var(--primary);
}

.toggle input:checked + .slider::before {
    transform: translateX(24px);
}

@media (max-width: 500px) {
    .container {
        padding: 23px 17px;
    }

    h1 {
        font-size: 26px;
    }

    .country {
        font-size: 25px;
    }

    .theme-toggle {
        top: 15px;
        right: 15px;
    }
}
.cursor-glow {
    position: fixed;
    top: 0;
    left: 0;
    width: 130px;
    height: 130px;
    pointer-events: none;
    border-radius: 50%;
    background: transparent;
    transform: translate(-50%, -50%);
    z-index: 0;
}

body.dark .cursor-glow {
    background: radial-gradient(circle,
        rgba(255,215,0,0.55) 0%,
        rgba(255,215,0,0.30) 35%,
        rgba(255,215,0,0.10) 60%,
        transparent 75%);
    filter: blur(1px);
}

.cursor-glow.shrink {
    transform: translate(-50%, -50%) scale(0.55);
    transition: transform 0.18s ease;
}

.page {
    position: relative;
    z-index: 1;
}
.flag {
  width: 48px;
  cursor: pointer;
  margin: 0 8px;
  border-radius: 4px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
}

.flag:hover {
  transform: scale(1.1);
}

.flag:active {
  transform: scale(0.9);
  opacity: 0.8;
}

.flag.active {
  box-shadow: 0 0 12px 4px #ffd700;
  transform: scale(1.1);
}
</style>
</head>

<body>
<div class="lang-switch">
    <svg onclick="setLang('pl')" viewBox="0 0 60 40" class="flag" role="button" tabindex="0" aria-label="Polski">
        <rect width="60" height="20" y="0" fill="#ffffff"/>
        <rect width="60" height="20" y="20" fill="#dc143c"/>
    </svg>

    <svg onclick="setLang('en')" viewBox="0 0 60 40" class="flag" role="button" tabindex="0" aria-label="English">
        <rect width="60" height="40" fill="#012169"/>
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#fff" stroke-width="8"/>
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#c8102e" stroke-width="4"/>
        <rect x="26" width="8" height="40" fill="#fff"/>
        <rect y="16" width="60" height="8" fill="#fff"/>
        <rect x="28" width="4" height="40" fill="#c8102e"/>
        <rect y="18" width="60" height="4" fill="#c8102e"/>
    </svg>

    <svg onclick="setLang('ua')" viewBox="0 0 60 40" class="flag" role="button" tabindex="0" aria-label="Українська">
        <rect width="60" height="20" y="0" fill="#0057b7"/>
        <rect width="60" height="20" y="20" fill="#ffd700"/>
    </svg>
</div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="theme-toggle">
    <span>🌞</span>
    <label class="toggle">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
    </label>
    <span>🌙</span>
</div>

<div class="container">

    <a href="index.html"
       data-pl="← Powrót do strony głównej"
       data-en="← Back to the homepage"
       data-ua="← Повернутися на головну сторінку">← Powrót do strony głównej</a>

    <h1
        data-pl="🌍 Tryb odkrywcy"
        data-en="🌍 Explorer mode"
        data-ua="🌍 Режим дослідника">🌍 Tryb odkrywcy</h1>

    <p class="description"
       data-pl="Sprawdź swoją wiedzę o europejskich stolicach! Wylosujemy państwo, a Ty wpiszesz jego stolicę."
       data-en="Test your knowledge of European capitals! A country will be chosen at random, and you will enter its capital."
       data-ua="Перевір свої знання про європейські столиці! Ми випадково оберемо країну, а ти введеш її столицю.">
        Sprawdź swoją wiedzę o europejskich stolicach!
        Wylosujemy państwo, a Ty wpiszesz jego stolicę.
    </p>

    <div class="stats">
        <div class="stat"><span data-pl="Punkty" data-en="Points" data-ua="Бали">Punkty</span><strong id="score">0</strong></div>
        <div class="stat"><span data-pl="Rekord" data-en="Best score" data-ua="Рекорд">Rekord</span><strong id="best">0</strong></div>
        <div class="stat"><span data-pl="Seria" data-en="Streak" data-ua="Серія">Seria</span><strong id="streak">0</strong></div>
    </div>

    <div class="country" id="country"
         data-pl="Przygotuj się!"
         data-en="Get ready!"
         data-ua="Приготуйся!">
        Przygotuj się!
    </div>

    <input
        type="text"
        id="answer"
        placeholder="Wpisz nazwę stolicy..."
        data-placeholder-pl="Wpisz nazwę stolicy..."
        data-placeholder-en="Enter the name of the capital..."
        data-placeholder-ua="Введи назву столиці..."
        autocomplete="off"
    >

    <div>
        <button class="primary" onclick="checkAnswer()"
                data-pl="Sprawdź" data-en="Check" data-ua="Перевірити">Sprawdź</button>
    </div>

    <div id="feedback"></div>

    <button class="secondary" onclick="resetGame()"
            data-pl="Zacznij od nowa" data-en="Start again" data-ua="Почати знову">Zacznij od nowa</button>

</div>

<script>
const countries = [
    { pl: ["Albania", "Tirana"], en: ["Albania", "Tirana"], ua: ["Албанія", "Тирана"] },
    { pl: ["Andora", "Andora la Vella"], en: ["Andorra", "Andorra la Vella"], ua: ["Андорра", "Андорра-ла-Велья"] },
    { pl: ["Austria", "Wiedeń"], en: ["Austria", "Vienna"], ua: ["Австрія", "Відень"] },
    { pl: ["Belgia", "Bruksela"], en: ["Belgium", "Brussels"], ua: ["Бельгія", "Брюссель"] },
    { pl: ["Białoruś", "Mińsk"], en: ["Belarus", "Minsk"], ua: ["Білорусь", "Мінськ"] },
    { pl: ["Bośnia i Hercegowina", "Sarajewo"], en: ["Bosnia and Herzegovina", "Sarajevo"], ua: ["Боснія і Герцеговина", "Сараєво"] },
    { pl: ["Bułgaria", "Sofia"], en: ["Bulgaria", "Sofia"], ua: ["Болгарія", "Софія"] },
    { pl: ["Chorwacja", "Zagrzeb"], en: ["Croatia", "Zagreb"], ua: ["Хорватія", "Загреб"] },
    { pl: ["Czarnogóra", "Podgorica"], en: ["Montenegro", "Podgorica"], ua: ["Чорногорія", "Подгориця"] },
    { pl: ["Czechy", "Praga"], en: ["Czechia", "Prague"], ua: ["Чехія", "Прага"] },
    { pl: ["Dania", "Kopenhaga"], en: ["Denmark", "Copenhagen"], ua: ["Данія", "Копенгаген"] },
    { pl: ["Estonia", "Tallinn"], en: ["Estonia", "Tallinn"], ua: ["Естонія", "Таллінн"] },
    { pl: ["Finlandia", "Helsinki"], en: ["Finland", "Helsinki"], ua: ["Фінляндія", "Гельсінкі"] },
    { pl: ["Francja", "Paryż"], en: ["France", "Paris"], ua: ["Франція", "Париж"] },
    { pl: ["Grecja", "Ateny"], en: ["Greece", "Athens"], ua: ["Греція", "Афіни"] },
    { pl: ["Hiszpania", "Madryt"], en: ["Spain", "Madrid"], ua: ["Іспанія", "Мадрид"] },
    { pl: ["Holandia", "Amsterdam"], en: ["The Netherlands", "Amsterdam"], ua: ["Нідерланди", "Амстердам"] },
    { pl: ["Irlandia", "Dublin"], en: ["Ireland", "Dublin"], ua: ["Ірландія", "Дублін"] },
    { pl: ["Islandia", "Reykjavik"], en: ["Iceland", "Reykjavik"], ua: ["Ісландія", "Рейк'явік"] },
    { pl: ["Kosowo", "Prisztina"], en: ["Kosovo", "Pristina"], ua: ["Косово", "Приштина"] },
    { pl: ["Liechtenstein", "Vaduz"], en: ["Liechtenstein", "Vaduz"], ua: ["Ліхтенштейн", "Вадуц"] },
    { pl: ["Litwa", "Wilno"], en: ["Lithuania", "Vilnius"], ua: ["Литва", "Вільнюс"] },
    { pl: ["Luksemburg", "Luksemburg"], en: ["Luxembourg", "Luxembourg"], ua: ["Люксембург", "Люксембург"] },
    { pl: ["Łotwa", "Ryga"], en: ["Latvia", "Riga"], ua: ["Латвія", "Рига"] },
    { pl: ["Macedonia Północna", "Skopje"], en: ["North Macedonia", "Skopje"], ua: ["Північна Македонія", "Скоп'є"] },
    { pl: ["Malta", "Valletta"], en: ["Malta", "Valletta"], ua: ["Мальта", "Валлетта"] },
    { pl: ["Mołdawia", "Kiszyniów"], en: ["Moldova", "Chisinau"], ua: ["Молдова", "Кишинів"] },
    { pl: ["Monako", "Monako"], en: ["Monaco", "Monaco"], ua: ["Монако", "Монако"] },
    { pl: ["Niemcy", "Berlin"], en: ["Germany", "Berlin"], ua: ["Німеччина", "Берлін"] },
    { pl: ["Norwegia", "Oslo"], en: ["Norway", "Oslo"], ua: ["Норвегія", "Осло"] },
    { pl: ["Polska", "Warszawa"], en: ["Poland", "Warsaw"], ua: ["Польща", "Варшава"] },
    { pl: ["Portugalia", "Lizbona"], en: ["Portugal", "Lisbon"], ua: ["Португалія", "Лісабон"] },
    { pl: ["Rosja", "Moskwa"], en: ["Russia", "Moscow"], ua: ["Росія", "Москва"] },
    { pl: ["Rumunia", "Bukareszt"], en: ["Romania", "Bucharest"], ua: ["Румунія", "Бухарест"] },
    { pl: ["San Marino", "San Marino"], en: ["San Marino", "San Marino"], ua: ["Сан-Марино", "Сан-Марино"] },
    { pl: ["Serbia", "Belgrad"], en: ["Serbia", "Belgrade"], ua: ["Сербія", "Белград"] },
    { pl: ["Słowacja", "Bratysława"], en: ["Slovakia", "Bratislava"], ua: ["Словаччина", "Братислава"] },
    { pl: ["Słowenia", "Lublana"], en: ["Slovenia", "Ljubljana"], ua: ["Словенія", "Любляна"] },
    { pl: ["Szwajcaria", "Berno"], en: ["Switzerland", "Bern"], ua: ["Швейцарія", "Берн"] },
    { pl: ["Szwecja", "Sztokholm"], en: ["Sweden", "Stockholm"], ua: ["Швеція", "Стокгольм"] },
    { pl: ["Turcja", "Ankara"], en: ["Turkey", "Ankara"], ua: ["Туреччина", "Анкара"] },
    { pl: ["Ukraina", "Kijów"], en: ["Ukraine", "Kyiv"], ua: ["Україна", "Київ"] },
    { pl: ["Watykan", "Watykan"], en: ["Vatican City", "Vatican City"], ua: ["Ватикан", "Ватикан"] },
    { pl: ["Węgry", "Budapeszt"], en: ["Hungary", "Budapest"], ua: ["Угорщина", "Будапешт"] },
    { pl: ["Wielka Brytania", "Londyn"], en: ["United Kingdom", "London"], ua: ["Велика Британія", "Лондон"] },
    { pl: ["Włochy", "Rzym"], en: ["Italy", "Rome"], ua: ["Італія", "Рим"] }
];

let currentCountry = null;
let score = 0;
let streak = 0;
let answered = false;
let currentLang = "pl";

let best = Number(localStorage.getItem("odkrywcaBest")) || 0;
document.getElementById("best").textContent = best;

function normalize(text) {
    return text.trim().toLocaleLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function localizedCountry(country, type = 0) {
    return country[currentLang][type];
}

function newQuestion() {
    currentCountry = countries[Math.floor(Math.random() * countries.length)];

    document.getElementById("country").textContent = localizedCountry(currentCountry, 0);
    document.getElementById("answer").value = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "";

    answered = false;
    document.getElementById("answer").focus();
}

function checkAnswer() {
    if (!currentCountry || answered) return;

    const answer = document.getElementById("answer").value;
    const feedback = document.getElementById("feedback");

    const messages = {
        pl: {
            empty: "Wpisz odpowiedź!",
            correct: "✓ Brawo! Poprawna odpowiedź!",
            wrong: "✗ Poprawna odpowiedź: "
        },
        en: {
            empty: "Enter an answer!",
            correct: "✓ Well done! Correct answer!",
            wrong: "✗ Correct answer: "
        },
        ua: {
            empty: "Введи відповідь!",
            correct: "✓ Молодець! Правильна відповідь!",
            wrong: "✗ Правильна відповідь: "
        }
    };

    if (!answer.trim()) {
        feedback.textContent = messages[currentLang].empty;
        feedback.className = "wrong";
        return;
    }

    answered = true;

    if (normalize(answer) === normalize(localizedCountry(currentCountry, 1))) {
        score++;
        streak++;

        feedback.textContent = messages[currentLang].correct;
        feedback.className = "correct";

        if (score > best) {
            best = score;
            localStorage.setItem("odkrywcaBest", best);
        }
    } else {
        streak = 0;
        feedback.textContent = messages[currentLang].wrong + localizedCountry(currentCountry, 1);
        feedback.className = "wrong";
    }

    updateStats();

    setTimeout(() => {
        newQuestion();
    }, 1500);
}

function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
    document.getElementById("streak").textContent = streak;
}

function resetGame() {
    score = 0;
    streak = 0;

    updateStats();
    newQuestion();
}

document.getElementById("answer").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkAnswer();
    }
});

const themeToggle = document.getElementById("themeToggle");

function applyTheme(theme) {
    document.body.classList.toggle("dark", theme === "dark");
    themeToggle.checked = theme === "dark";
}

themeToggle.addEventListener("change", function() {
    const theme = this.checked ? "dark" : "light";

    localStorage.setItem("theme", theme);
    applyTheme(theme);
});

applyTheme(localStorage.getItem("theme") || "light");

newQuestion();

const glow = document.getElementById("cursorGlow");

document.addEventListener("mousemove", (e) => {
  glow.style.left = e.clientX + "px";
  glow.style.top = e.clientY + "px";
  glow.style.opacity = "1";
});

document.addEventListener("mouseleave", () => {
  glow.style.opacity = "0";
});

document.addEventListener("mouseenter", () => {
  glow.style.opacity = "1";
});

document.addEventListener("click", () => {
  glow.classList.add("shrink");
  setTimeout(() => {
    glow.classList.remove("shrink");
  }, 180);
});
function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang === "ua" ? "uk" : lang;

    document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.innerHTML = el.getAttribute('data-' + lang);
    });

    const title = document.querySelector('title');
    if (title && title.getAttribute('data-' + lang)) {
        title.textContent = title.getAttribute('data-' + lang);
    }

    const answerInput = document.getElementById("answer");
    if (answerInput) {
        answerInput.placeholder = answerInput.getAttribute("data-placeholder-" + lang);
    }

    if (currentCountry) {
        document.getElementById("country").textContent = localizedCountry(currentCountry, 0);
    }

    localStorage.setItem('lang', lang);

    document.querySelectorAll('.flag').forEach(f => f.classList.remove('active'));
    const activeFlag = document.querySelector(
        `.flag[onclick="setLang('${lang}')"]`
    );
    if (activeFlag) activeFlag.classList.add('active');

    document.dispatchEvent(
        new CustomEvent("languageChanged", { detail: lang })
    );
}

document.addEventListener('DOMContentLoaded', () => {
    const lang = localStorage.getItem('lang')
        || ({ en: 'en', ua: 'ua', pl: 'pl' }[navigator.language.slice(0, 2)] || 'pl');

    setLang(lang);
});
</script>

</body>
</html>
